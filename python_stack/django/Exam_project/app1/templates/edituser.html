<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
</head>
<body>
    <fieldset>
        <legend>Edit Form</legend>
        <form action="/edituser" method="post">
            {% csrf_token %}
            <label for="">Firstname: </label>
            <input type="text" name="firstname" placeholder="fill firstname" value="{{ user.firstname }}">
            <br><br>
            <label for="">Lastname: </label>
            <input type="text" name="lastname" placeholder="fill lastname" value="{{ user.lastname}}">
            <br><br>
            <label for="">Username: </label>
            <input type="text" name="username" placeholder="fill Username" value="{{ user.username }}">
            <br><br>
            <label for="">Password: </label>
            <input type="password" name="password" placeholder="fill password" value="{{ user.password }}">
            <br><br>

            <input type="hidden" name="id" value="{{user.id}}">
            <input type="submit" value="Edit">

        </form>
    </fieldset>
    <a href="{% url 'homeroute' %}">Back</a>
</body>
</html>
