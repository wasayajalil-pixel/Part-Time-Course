{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <link rel="stylesheet" href="{% static 'menu.css' %}">
</head>
<body>

<nav>
    <h2>Menu</h2>
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/menu/new">Add Item</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<section>
    <h1>Our Menu</h1>

    <div class="grid">
        {% for item in items %}
        <div class="menu-card">
            <img src="{{ item.image_url }}">
            <div class="body">
                <span>{{ item.category }}</span>
                <h3>{{ item.name }}</h3>
                <p>{{ item.description }}</p>
                <h4>{{ item.price }} ₪</h4>
                <a href="/menu/{{ item.id }}/edit">Edit</a>
                <a href="/menu/{{ item.id }}/delete" class="delete">Delete</a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

</body>
</html>
