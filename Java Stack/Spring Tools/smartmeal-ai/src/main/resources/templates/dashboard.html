<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-5xl mx-auto p-6 pb-24"><div class="flex justify-between"><h1 class="text-3xl font-bold">SmartMeal AI</h1><button onclick="api('/api/auth/logout',{method:'POST'}).then(()=>location='/')">Logout</button></div><h2 id="hello" class="text-2xl mt-8"></h2><section class="grid md:grid-cols-3 gap-4 mt-6"><div class="bg-white p-6 rounded-2xl shadow md:col-span-2"><p>Today's Calories</p><div class="text-4xl font-bold"><span id="cal">0</span> / <span id="goal">2200</span> kcal</div><div class="h-3 bg-slate-200 rounded mt-4"><div id="bar" class="h-3 bg-green-600 rounded"></div></div></div><div class="bg-white p-6 rounded-2xl shadow"><p>Meals logged</p><b id="count" class="text-4xl">0</b></div></section><section class="bg-white rounded-2xl p-6 shadow mt-6"><h3 class="font-bold text-xl">Quick Add Meal</h3><form id="mealForm" class="grid md:grid-cols-4 gap-3 mt-4"><input id="mn" class="border p-3 rounded" placeholder="Meal name"><select id="mt" class="border p-3 rounded"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select><input id="mc" type="number" class="border p-3 rounded" placeholder="Calories"><button class="bg-green-600 text-white rounded">Add</button></form></section><section class="bg-white rounded-2xl p-6 shadow mt-6"><h3 class="font-bold text-xl">AI Recommendation</h3><div id="rec" class="mt-3"></div></section></main><div data-nav></div><script>async function load(){let u=await api('/api/profile'),ms=await api('/api/meals/today'),rs=await api('/api/recommendations');hello.textContent='Good morning, '+u.fullName+' 👋';goal.textContent=u.dailyCalorieGoal;let c=ms.reduce((a,m)=>a+(m.calories||0),0);cal.textContent=c;count.textContent=ms.length;bar.style.width=Math.min(100,c/u.dailyCalorieGoal*100)+'%';rec.innerHTML=`<b>${rs[0].name}</b><p>${rs[0].calories} kcal · ${rs[0].protein}g protein</p><a class="text-green-700" href="/meal-details">View details</a>`}mealForm.onsubmit=async e=>{e.preventDefault();await api('/api/meals',{method:'POST',body:JSON.stringify({name:mn.value,mealType:mt.value,calories:+mc.value,protein:0,carbs:0,fat:0,fiber:0})});toast('Meal added');mealForm.reset();load()};load()</script></body></html>
