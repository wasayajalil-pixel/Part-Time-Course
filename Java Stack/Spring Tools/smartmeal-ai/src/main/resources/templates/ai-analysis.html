<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-3xl mx-auto p-6 pb-24"><h1 class="text-3xl font-bold">AI Analysis</h1><div id="box" class="mt-6"></div></main><div data-nav></div><script>api('/api/analysis/summary').then(a=>box.innerHTML=`<div class="grid md:grid-cols-2 gap-4"><div class="bg-white rounded-2xl p-7 shadow text-center"><div class="text-6xl font-bold text-green-600">${a.score}</div><p>Overall score / 100</p></div><div class="bg-white rounded-2xl p-7 shadow"><p><b>Meals logged:</b> ${a.mealsLogged}</p><p><b>Weekly calories:</b> ${a.weeklyCalories}</p><p><b>Vegetable meals:</b> ${a.vegetableMeals}</p><p><b>Fast-food meals:</b> ${a.fastFoodMeals}</p></div></div><div class="bg-white rounded-2xl p-7 shadow mt-4"><h2 class="font-bold text-xl">Analysis summary</h2><p class="mt-2">${a.summary}</p></div>`)</script></body></html>
