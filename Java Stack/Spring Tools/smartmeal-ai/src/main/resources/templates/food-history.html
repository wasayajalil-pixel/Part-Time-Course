<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-3xl mx-auto p-6 pb-24"><h1 class="text-3xl font-bold">Food History</h1><input id="search" class="w-full border p-3 rounded-xl mt-5" placeholder="Search meals"><div id="list" class="space-y-3 mt-5"></div></main><div data-nav></div><script>let all=[];function draw(){let q=search.value.toLowerCase();list.innerHTML=all.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<div class="bg-white p-4 rounded-xl shadow flex justify-between"><div><b>${x.name}</b><p class="text-sm text-slate-500">${x.mealType} · ${new Date(x.eatenAt).toLocaleString()}</p></div><div><b>${x.calories||0} kcal</b><button class="block text-red-600" onclick="del(${x.id})">Delete</button></div></div>`).join('')||'<p>No meals yet.</p>'}async function del(id){await api('/api/meals/'+id,{method:'DELETE'});all=all.filter(x=>x.id!==id);draw()}api('/api/meals/history').then(x=>{all=x;draw()});search.oninput=draw</script></body></html>
