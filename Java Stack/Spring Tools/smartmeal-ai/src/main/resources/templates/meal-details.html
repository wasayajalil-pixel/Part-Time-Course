<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-2xl mx-auto p-6 pb-24"><div class="bg-white rounded-3xl shadow overflow-hidden"><div class="h-64 bg-slate-200 grid place-items-center text-8xl">🥙</div><div class="p-7"><div class="flex justify-between"><h1 class="text-3xl font-bold">Grilled Chicken Bowl</h1><b>520 kcal</b></div><div class="grid grid-cols-4 gap-2 text-center mt-5"><div>Protein<br><b>38g</b></div><div>Carbs<br><b>45g</b></div><div>Fat<br><b>16g</b></div><div>Fiber<br><b>6g</b></div></div><h2 class="font-bold mt-6">Ingredients</h2><p>Grilled chicken, brown rice, avocado, broccoli, cherry tomatoes, olive oil.</p><button id="add" class="w-full mt-6 bg-green-600 text-white p-3 rounded-xl">Add to Today's Meals</button></div></div></main><div data-nav></div><script>add.onclick=async()=>{await api('/api/meals',{method:'POST',body:JSON.stringify({name:'Grilled Chicken Bowl',mealType:'Lunch',calories:520,protein:38,carbs:45,fat:16,fiber:6})});toast('Meal added')}</script></body></html>
