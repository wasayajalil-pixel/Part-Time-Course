<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-3xl mx-auto p-6 pb-24"><h1 class="text-3xl font-bold">Restaurants Near You</h1><input id="q" class="w-full border p-3 rounded-xl mt-5" placeholder="Search cuisine or tags"><div id="list" class="space-y-4 mt-5"></div></main><div data-nav></div><script>async function load(){let x=await api('/api/restaurants?q='+encodeURIComponent(q.value));list.innerHTML=x.map(r=>`<div class="bg-white p-5 rounded-2xl shadow"><div class="flex justify-between"><div><h2 class="font-bold text-xl">${r.name}</h2><p>${r.cuisine} · ${r.tags}</p><p class="text-slate-500">${r.address} · ${r.distanceKm} km</p></div><b>⭐ ${r.rating}</b></div></div>`).join('')}q.oninput=load;load()</script></body></html>
