<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-4xl mx-auto p-6 pb-24"><h1 class="text-3xl font-bold">AI Recommendations</h1><div id="list" class="grid md:grid-cols-2 gap-4 mt-6"></div></main><div data-nav></div><script>api('/api/recommendations').then(x=>list.innerHTML=x.map(m=>`<div class="bg-white rounded-2xl p-6 shadow"><h2 class="font-bold text-xl">${m.name}</h2><p>${m.calories} kcal · ${m.protein}g protein</p><p class="text-sm text-green-700">${m.tags.join(' · ')}</p><button class="mt-4 bg-green-600 text-white px-4 py-2 rounded-xl" onclick='add(${JSON.stringify(m)})'>Add today</button></div>`).join(''));async function add(m){await api('/api/meals',{method:'POST',body:JSON.stringify({...m,mealType:'Recommended'})});toast('Added to today')}</script></body></html>
