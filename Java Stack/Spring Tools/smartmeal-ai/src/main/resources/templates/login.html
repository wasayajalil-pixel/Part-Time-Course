<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-md mx-auto py-20 px-5"><div class="bg-white p-8 rounded-3xl shadow"><h1 class="text-3xl font-bold">Welcome Back!</h1><p class="text-slate-500 mb-6">Login to continue</p><form id="f" class="space-y-4"><input id="email" class="w-full border p-3 rounded-xl" placeholder="Email"><input id="password" type="password" class="w-full border p-3 rounded-xl" placeholder="Password"><button class="w-full bg-green-600 text-white p-3 rounded-xl">Login</button></form><p class="mt-5 text-center">No account? <a class="text-green-700" href="/register">Sign up</a></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});location='/dashboard'}catch(x){toast(x.message,false)}}</script></body></html>
