<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-xl mx-auto py-10 px-5"><div class="bg-white p-8 rounded-3xl shadow"><h1 class="text-3xl font-bold">Create Your Account</h1><form id="f" class="grid md:grid-cols-2 gap-4 mt-6"><input id="fullName" class="border p-3 rounded-xl md:col-span-2" placeholder="Full name"><input id="email" class="border p-3 rounded-xl md:col-span-2" placeholder="Email"><input id="password" type="password" class="border p-3 rounded-xl md:col-span-2" placeholder="Password"><input id="age" type="number" class="border p-3 rounded-xl" placeholder="Age"><select id="gender" class="border p-3 rounded-xl"><option>Male</option><option>Female</option></select><input id="heightCm" type="number" class="border p-3 rounded-xl" placeholder="Height cm"><input id="weightKg" type="number" class="border p-3 rounded-xl" placeholder="Weight kg"><select id="goal" class="border p-3 rounded-xl md:col-span-2"><option>Lose Weight</option><option>Maintain Weight</option><option>Gain Weight</option></select><button class="bg-green-600 text-white p-3 rounded-xl md:col-span-2">Create account</button></form></div></main><script>f.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({fullName:fullName.value,email:email.value,password:password.value,age:+age.value,gender:gender.value,heightCm:+heightCm.value,weightKg:+weightKg.value,goal:goal.value})});location='/dashboard'}catch(x){toast(x.message,false)}}</script></body></html>
