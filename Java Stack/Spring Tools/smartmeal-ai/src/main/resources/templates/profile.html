<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal AI</title><script src="https://cdn.tailwindcss.com"></script><script defer src="/js/app.js"></script></head><body class="bg-slate-50 text-slate-900 min-h-screen"><main class="max-w-2xl mx-auto p-6 pb-24"><h1 class="text-3xl font-bold">Profile & Settings</h1><form id="f" class="bg-white rounded-2xl shadow p-6 mt-6 space-y-4"><input id="fullName" class="w-full border p-3 rounded-xl"><input id="email" disabled class="w-full border p-3 rounded-xl bg-slate-100"><select id="goal" class="w-full border p-3 rounded-xl"><option>Lose Weight</option><option>Maintain Weight</option><option>Gain Weight</option></select><input id="dailyCalorieGoal" type="number" class="w-full border p-3 rounded-xl"><button class="w-full bg-green-600 text-white p-3 rounded-xl">Save</button></form></main><div data-nav></div><script>api('/api/profile').then(u=>{fullName.value=u.fullName;email.value=u.email;goal.value=u.goal;dailyCalorieGoal.value=u.dailyCalorieGoal});f.onsubmit=async e=>{e.preventDefault();await api('/api/profile',{method:'PUT',body:JSON.stringify({fullName:fullName.value,goal:goal.value,dailyCalorieGoal:+dailyCalorieGoal.value})});toast('Profile saved')}</script></body></html>
